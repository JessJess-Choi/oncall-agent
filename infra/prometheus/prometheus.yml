global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: order-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["order-api:8080"]
        labels:
          service: order-api
  - job_name: payment-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["payment-api:8081"]
        labels:
          service: payment-api

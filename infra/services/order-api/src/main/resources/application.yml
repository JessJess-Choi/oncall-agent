spring:
  application:
    name: order-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/shop}
    username: ${DB_USER:app}
    password: ${DB_PASSWORD:app}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 3000

server:
  port: 8080

app:
  version: ${APP_VERSION:1.0.0}
  payment-base-url: ${PAYMENT_BASE_URL:http://toxiproxy:18081}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        http.client.requests: true

logging:
  structured:
    format:
      console: logstash
    # 운영에서 흔히 쓰는 스택트레이스 축약. 장애 구간 로그가 분당 수 MB로 불어나는 것을 막는다.
    # 예외마다 앞쪽 12프레임만, 전체 3000자까지. 원인(Caused by) 체인은 남는다.
    json:
      stacktrace:
        max-throwable-depth: 12
        max-length: 3000
        include-common-frames: false
